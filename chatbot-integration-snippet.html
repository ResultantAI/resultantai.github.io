<!--
  ResultantAI Chatbot Integration Snippet
  ========================================

  Use the LAZY-LOAD pattern below. Do NOT load chatbot.css in <head>
  or chatbot.js as a synchronous <script> tag — that pattern was the
  old eager approach and causes unnecessary render-blocking on page load.
-->

<!-- Add before closing </body> tag — lazy loads on first user interaction -->
<script>
(function() {
  var loaded = false;
  function loadChatbot() {
    if (loaded) return;
    loaded = true;
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = '/css/chatbot.css';
    document.head.appendChild(link);
    var script = document.createElement('script');
    script.src = '/js/chatbot.js';
    document.body.appendChild(script);
  }
  window.addEventListener('scroll', loadChatbot, { once: true, passive: true });
  window.addEventListener('mousemove', loadChatbot, { once: true, passive: true });
  window.addEventListener('touchstart', loadChatbot, { once: true, passive: true });
})();
</script>


<!--
  OPTIONAL: Custom Configuration
  ===============================

  If you need to customize the chatbot behavior, add this BEFORE the
  lazy-load block above:
-->

<script>
  window.RESULTANT_CHATBOT_CONFIG = {
    apiEndpoint: 'https://your-custom-api.com/chat',
    storageKey: 'custom_chat_history',
    maxHistoryLength: 30,
    disableWelcome: false,
    welcomeDelay: 3000,
  };
</script>


<!--
  REFERENCE: index.html is the canonical implementation.
  Read the lazy-load block at the bottom of index.html <body>
  before adding chatbot to any new page.
-->
